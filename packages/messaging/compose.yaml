name: pps-messaging
services:
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    hostname: pps-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: pps
      RABBITMQ_DEFAULT_PASS: pps-local-only
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
volumes:
  rabbitmq-data:
