AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: PPS Catalog Service

Parameters:
  MongoDbSecretArn:
    Type: String
    Description: ARN of a Secrets Manager secret with a MONGODB_URI JSON property
  MongoDbDatabase:
    Type: String
    Default: pps_catalog
  RedisClusterUrls:
    Type: String
    Default: ''
    Description: Comma-separated redis:// or rediss:// Redis Cluster node URLs; empty disables caching
  RedisMode:
    Type: String
    Default: cluster
    AllowedValues: [standalone, cluster]
  RedisPoolSize:
    Type: Number
    Default: 16
    MinValue: 1
    MaxValue: 100
  ElasticsearchUrl:
    Type: String
    Default: ''
    Description: Elasticsearch HTTPS endpoint; empty keeps MongoDB text search active
  ElasticsearchTimeoutMs:
    Type: Number
    Default: 500
    MinValue: 50
    MaxValue: 5000

Resources:
  CatalogFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: rust-cargolambda
      BuildProperties:
        Binary: api
    Properties:
      FunctionName: PPS-CatalogService
      CodeUri: .
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 15
      Environment:
        Variables:
          MONGODB_URI: !Sub '{{resolve:secretsmanager:${MongoDbSecretArn}:SecretString:MONGODB_URI}}'
          MONGODB_DATABASE: !Ref MongoDbDatabase
          REDIS_CLUSTER_URLS: !Ref RedisClusterUrls
          REDIS_MODE: !Ref RedisMode
          REDIS_POOL_SIZE: !Ref RedisPoolSize
          ELASTICSEARCH_URL: !Ref ElasticsearchUrl
          ELASTICSEARCH_TIMEOUT_MS: !Ref ElasticsearchTimeoutMs
          ADMIN_AUTH_MODE: disabled
          RUST_LOG: info
      Events:
        ProxyApi:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
        CreateVehicleModelApi:
          Type: HttpApi
          Properties:
            Path: /admin/vehicle-models
            Method: POST
        CreateVehicleGenerationApi:
          Type: HttpApi
          Properties:
            Path: /admin/vehicle-generations
            Method: POST
        CategoryApi:
          Type: HttpApi
          Properties:
            Path: /admin/categories
            Method: ANY
        BrandOptionsApi:
          Type: HttpApi
          Properties:
            Path: /admin/brands
            Method: GET
        VehicleTrimApi:
          Type: HttpApi
          Properties:
            Path: /admin/vehicle-trims
            Method: POST

Outputs:
  ApiUrl:
    Value: !Sub 'https://${ServerlessHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
