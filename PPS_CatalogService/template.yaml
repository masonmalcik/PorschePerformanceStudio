AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: PPS Catalog Service

Parameters:
  MongoDbSecretArn:
    Type: String
    Description: ARN of a Secrets Manager secret with a MONGODB_URI JSON property
  MongoDbDatabase:
    Type: String
    Default: pps_catalog
  RedisClusterUrls:
    Type: String
    Default: ''
    Description: Comma-separated redis:// or rediss:// Redis Cluster node URLs; empty disables caching
  RedisMode:
    Type: String
    Default: cluster
    AllowedValues: [standalone, cluster]
  RedisPoolSize:
    Type: Number
    Default: 16
    MinValue: 1
    MaxValue: 100
  ElasticsearchUrl:
    Type: String
    Default: ''
    Description: Elasticsearch HTTPS endpoint; empty keeps MongoDB text search active
  ElasticsearchTimeoutMs:
    Type: Number
    Default: 500
    MinValue: 50
    MaxValue: 5000
  CognitoIssuer:
    Type: String
    Description: Cognito User Pool issuer URL
  CognitoClientId:
    Type: String
    Description: Cognito app client ID accepted by the Catalog service
  CognitoJwksUrl:
    Type: String
    Description: Cognito User Pool JWKS URL
  CorsAllowedOrigins:
    Type: String
    Default: http://localhost:3000,http://localhost:4321,http://localhost:5173,https://masonmalcik.github.io
    Description: Comma-separated exact browser origins allowed to call the Catalog API

  AlarmEvaluationPeriods:
    Type: Number
    Default: 1
    MinValue: 1

Resources:
  ServerlessHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [http://localhost:3000, http://localhost:4321, http://localhost:5173, https://masonmalcik.github.io]
        AllowMethods: [GET, POST, PATCH, DELETE, OPTIONS]
        AllowHeaders: [Authorization, Content-Type, If-None-Match, X-Request-ID]
        ExposeHeaders: [Cache-Control, ETag, X-Request-ID]
        MaxAge: 3600

  CatalogFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: rust-cargolambda
      BuildProperties:
        Binary: api
    Properties:
      FunctionName: PPS-CatalogService
      CodeUri: .
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 15
      Environment:
        Variables:
          MONGODB_URI: !Sub '{{resolve:secretsmanager:${MongoDbSecretArn}:SecretString:MONGODB_URI}}'
          MONGODB_DATABASE: !Ref MongoDbDatabase
          REDIS_CLUSTER_URLS: !Ref RedisClusterUrls
          REDIS_MODE: !Ref RedisMode
          REDIS_POOL_SIZE: !Ref RedisPoolSize
          ELASTICSEARCH_URL: !Ref ElasticsearchUrl
          ELASTICSEARCH_TIMEOUT_MS: !Ref ElasticsearchTimeoutMs
          ADMIN_AUTH_MODE: cognito
          COGNITO_ISSUER: !Ref CognitoIssuer
          COGNITO_CLIENT_ID: !Ref CognitoClientId
          COGNITO_JWKS_URL: !Ref CognitoJwksUrl
          CORS_ALLOWED_ORIGINS: !Ref CorsAllowedOrigins
          RUST_LOG: info
      Events:
        ProxyApi:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
        CreateVehicleModelApi:
          Type: HttpApi
          Properties:
            Path: /admin/vehicle-models
            Method: POST
        CreateVehicleGenerationApi:
          Type: HttpApi
          Properties:
            Path: /admin/vehicle-generations
            Method: POST
        CategoryApi:
          Type: HttpApi
          Properties:
            Path: /admin/categories
            Method: ANY
        BrandOptionsApi:
          Type: HttpApi
          Properties:
            Path: /admin/brands
            Method: GET
        VehicleTrimApi:
          Type: HttpApi
          Properties:
            Path: /admin/vehicle-trims
            Method: POST

  CatalogAssetsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  CatalogLambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: PPS Catalog Lambda errors detected
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref CatalogFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: !Ref AlarmEvaluationPeriods
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  CatalogLambdaThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: PPS Catalog Lambda throttles detected
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref CatalogFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: !Ref AlarmEvaluationPeriods
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  CatalogLambdaDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: PPS Catalog Lambda p95 duration is above ten seconds
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref CatalogFunction
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: !Ref AlarmEvaluationPeriods
      Threshold: 10000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

Outputs:
  ApiUrl:
    Value: !Sub 'https://${ServerlessHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  AssetsBucketName:
    Value: !Ref CatalogAssetsBucket
  AssetsBaseUrl:
    Description: Public asset route served by the Catalog API until CloudFront account verification is complete
    Value: !Sub 'https://${ServerlessHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/assets'
