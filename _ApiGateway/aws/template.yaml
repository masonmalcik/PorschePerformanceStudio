AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: PPS unified HTTP API and serverless checkout event topology

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [x86_64]
    MemorySize: 512
    Timeout: 30
    Environment:
      Variables:
        NODE_ENV: production
        MESSAGE_TRANSPORT: aws

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]
  CognitoIssuer:
    Type: String
    Default: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_M6K1hvDSx
  CognitoAudience:
    Type: String
    Default: 1n58iicfsjglca4bghrvjhon8q
  CartTableName:
    Type: String
    Default: pps-carts-dev
  OrderDatabaseSecretName:
    Type: String
    Default: pps/order/dev
  PaymentDatabaseSecretName:
    Type: String
    Default: pps/payment/dev
  StripeSecretName:
    Type: String
    Default: pps/stripe/dev
  CatalogApiUrl:
    Type: String
    Default: https://lvnqza3dre.execute-api.us-east-1.amazonaws.com

Resources:
  PpsHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub pps-http-api-${Environment}
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: [http://localhost:3000, http://localhost:4321, http://localhost:5173, https://masonmalcik.github.io]
        AllowMethods: [GET, POST, PATCH, DELETE, OPTIONS]
        AllowHeaders: [Authorization, Content-Type, Idempotency-Key, Stripe-Signature, X-Request-ID]
        ExposeHeaders: [ETag, X-Request-ID]
        MaxAge: 3600

  CognitoJwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref PpsHttpApi
      Name: pps-cognito-jwt
      AuthorizerType: JWT
      IdentitySource: ['$request.header.Authorization']
      JwtConfiguration:
        Audience: [!Ref CognitoAudience]
        Issuer: !Ref CognitoIssuer

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref PpsHttpApi
      StageName: '$default'
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50

  CartIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref PpsHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt CartFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 15000
      RequestParameters:
        overwrite:header.x-authenticated-user-id: $context.authorizer.jwt.claims.sub
  OrderIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref PpsHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt OrderFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 15000
      RequestParameters:
        overwrite:header.x-authenticated-user-id: $context.authorizer.jwt.claims.sub
  PaymentIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref PpsHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt PaymentFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 15000
      RequestParameters:
        overwrite:header.x-authenticated-user-id: $context.authorizer.jwt.claims.sub
  PaymentWebhookIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref PpsHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt PaymentFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 15000
  CatalogIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref PpsHttpApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      IntegrationUri: !Sub '${CatalogApiUrl}/{proxy}'
      PayloadFormatVersion: '1.0'
      TimeoutInMillis: 15000
  CatalogAdminIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref PpsHttpApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      IntegrationUri: !Sub '${CatalogApiUrl}/admin/{proxy}'
      PayloadFormatVersion: '1.0'
      TimeoutInMillis: 15000

  CartRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref PpsHttpApi, RouteKey: 'ANY /api/v1/cart/{proxy+}', AuthorizationType: JWT, AuthorizerId: !Ref CognitoJwtAuthorizer, Target: !Sub 'integrations/${CartIntegration}' }
  OrderRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref PpsHttpApi, RouteKey: 'ANY /api/v1/orders/{proxy+}', AuthorizationType: JWT, AuthorizerId: !Ref CognitoJwtAuthorizer, Target: !Sub 'integrations/${OrderIntegration}' }
  OrderRootRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref PpsHttpApi, RouteKey: 'POST /api/v1/orders', AuthorizationType: JWT, AuthorizerId: !Ref CognitoJwtAuthorizer, Target: !Sub 'integrations/${OrderIntegration}' }
  PaymentRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref PpsHttpApi, RouteKey: 'ANY /api/v1/payments/{proxy+}', AuthorizationType: JWT, AuthorizerId: !Ref CognitoJwtAuthorizer, Target: !Sub 'integrations/${PaymentIntegration}' }
  PaymentWebhookRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref PpsHttpApi, RouteKey: 'POST /api/v1/payments/webhook', AuthorizationType: NONE, Target: !Sub 'integrations/${PaymentWebhookIntegration}' }
  CatalogProductsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref PpsHttpApi, RouteKey: 'ANY /api/v1/catalog/{proxy+}', AuthorizationType: NONE, Target: !Sub 'integrations/${CatalogIntegration}' }
  CatalogAdminRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PpsHttpApi
      RouteKey: 'ANY /api/v1/catalog/admin/{proxy+}'
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoJwtAuthorizer
      AuthorizationScopes: [pps-api/catalog.admin]
      Target: !Sub 'integrations/${CatalogAdminIntegration}'

  CartInvokePermission:
    Type: AWS::Lambda::Permission
    Properties: { Action: lambda:InvokeFunction, FunctionName: !Ref CartFunction, Principal: apigateway.amazonaws.com, SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${PpsHttpApi}/*/*' }
  OrderInvokePermission:
    Type: AWS::Lambda::Permission
    Properties: { Action: lambda:InvokeFunction, FunctionName: !Ref OrderFunction, Principal: apigateway.amazonaws.com, SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${PpsHttpApi}/*/*' }
  PaymentInvokePermission:
    Type: AWS::Lambda::Permission
    Properties: { Action: lambda:InvokeFunction, FunctionName: !Ref PaymentFunction, Principal: apigateway.amazonaws.com, SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${PpsHttpApi}/*/*' }
  EventsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub pps-events-${Environment}
      KmsMasterKeyId: alias/aws/sns

  PaymentEventsDlq:
    Type: AWS::SQS::Queue
    Properties: { QueueName: !Sub 'pps-payment-events-${Environment}-dlq', MessageRetentionPeriod: 1209600, SqsManagedSseEnabled: true }
  PaymentEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub pps-payment-events-${Environment}
      VisibilityTimeout: 180
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy: { deadLetterTargetArn: !GetAtt PaymentEventsDlq.Arn, maxReceiveCount: 5 }
  OrderEventsDlq:
    Type: AWS::SQS::Queue
    Properties: { QueueName: !Sub 'pps-order-events-${Environment}-dlq', MessageRetentionPeriod: 1209600, SqsManagedSseEnabled: true }
  OrderEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub pps-order-events-${Environment}
      VisibilityTimeout: 180
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy: { deadLetterTargetArn: !GetAtt OrderEventsDlq.Arn, maxReceiveCount: 5 }
  InventoryEventsDlq:
    Type: AWS::SQS::Queue
    Properties: { QueueName: !Sub 'pps-inventory-events-${Environment}-dlq', MessageRetentionPeriod: 1209600, SqsManagedSseEnabled: true }
  InventoryEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub pps-inventory-events-${Environment}
      VisibilityTimeout: 180
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy: { deadLetterTargetArn: !GetAtt InventoryEventsDlq.Arn, maxReceiveCount: 5 }
  NotificationEventsDlq:
    Type: AWS::SQS::Queue
    Properties: { QueueName: !Sub 'pps-notification-events-${Environment}-dlq', MessageRetentionPeriod: 1209600, SqsManagedSseEnabled: true }
  NotificationEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub pps-notification-events-${Environment}
      VisibilityTimeout: 180
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy: { deadLetterTargetArn: !GetAtt NotificationEventsDlq.Arn, maxReceiveCount: 5 }

  PaymentSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref EventsTopic
      Protocol: sqs
      Endpoint: !GetAtt PaymentEventsQueue.Arn
      RawMessageDelivery: true
      FilterPolicyScope: MessageAttributes
      FilterPolicy: { eventType: [payment.requested] }
  OrderSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref EventsTopic
      Protocol: sqs
      Endpoint: !GetAtt OrderEventsQueue.Arn
      RawMessageDelivery: true
      FilterPolicyScope: MessageAttributes
      FilterPolicy: { eventType: [payment.succeeded, payment.failed, inventory.reserved, inventory.rejected, inventory.released] }
  InventorySubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref EventsTopic
      Protocol: sqs
      Endpoint: !GetAtt InventoryEventsQueue.Arn
      RawMessageDelivery: true
      FilterPolicyScope: MessageAttributes
      FilterPolicy: { eventType: [order.created, inventory.release-requested] }
  NotificationSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref EventsTopic
      Protocol: sqs
      Endpoint: !GetAtt NotificationEventsQueue.Arn
      RawMessageDelivery: true
      FilterPolicyScope: MessageAttributes
      FilterPolicy: { eventType: [payment.succeeded, payment.failed, inventory.rejected, order.confirmed, order.failed, order.cancelled, order.compensated] }

  EventsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref PaymentEventsQueue, !Ref OrderEventsQueue, !Ref InventoryEventsQueue, !Ref NotificationEventsQueue]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: sns.amazonaws.com }
            Action: sqs:SendMessage
            Resource: [!GetAtt PaymentEventsQueue.Arn, !GetAtt OrderEventsQueue.Arn, !GetAtt InventoryEventsQueue.Arn, !GetAtt NotificationEventsQueue.Arn]
            Condition: { ArnEquals: { aws:SourceArn: !Ref EventsTopic } }

  CartFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub pps-cart-${Environment}
      CodeUri: ../../deploy/artifacts/cart/
      Handler: dist/lambda.handler
      Environment:
        Variables:
          DYNAMODB_CART_TABLE: !Ref CartTableName
          MEMCACHED_SERVERS: disabled
          TRUSTED_USER_HEADER: x-authenticated-user-id
          CORS_ORIGIN: '*'
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref CartTableName }

  OrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub pps-order-${Environment}
      CodeUri: ../../deploy/artifacts/order/
      Handler: dist/lambda.handler
      Environment:
        Variables:
          DATABASE_URL: !Sub '{{resolve:secretsmanager:${OrderDatabaseSecretName}:SecretString:DATABASE_URL}}'
          EVENTS_TOPIC_ARN: !Ref EventsTopic
          TRUSTED_USER_HEADER: x-authenticated-user-id
          CORS_ORIGIN: '*'
      Policies:
        - SNSPublishMessagePolicy: { TopicName: !GetAtt EventsTopic.TopicName }

  OrderEventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub pps-order-events-${Environment}
      CodeUri: ../../deploy/artifacts/order/
      Handler: dist/lambda.events
      Environment:
        Variables:
          DATABASE_URL: !Sub '{{resolve:secretsmanager:${OrderDatabaseSecretName}:SecretString:DATABASE_URL}}'
          EVENTS_TOPIC_ARN: !Ref EventsTopic
      Policies:
        - SNSPublishMessagePolicy: { TopicName: !GetAtt EventsTopic.TopicName }
      Events:
        CheckoutEvents:
          Type: SQS
          Properties:
            Queue: !GetAtt OrderEventsQueue.Arn
            BatchSize: 10
            FunctionResponseTypes: [ReportBatchItemFailures]

  OrderOutboxFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub pps-order-outbox-${Environment}
      CodeUri: ../../deploy/artifacts/order/
      Handler: dist/lambda.publishOutbox
      Environment:
        Variables:
          DATABASE_URL: !Sub '{{resolve:secretsmanager:${OrderDatabaseSecretName}:SecretString:DATABASE_URL}}'
          EVENTS_TOPIC_ARN: !Ref EventsTopic
      Policies:
        - SNSPublishMessagePolicy: { TopicName: !GetAtt EventsTopic.TopicName }
      Events:
        Schedule:
          Type: ScheduleV2
          Properties: { ScheduleExpression: rate(1 minute) }

  PaymentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub pps-payment-${Environment}
      CodeUri: ../../deploy/artifacts/payment/
      Handler: dist/lambda.handler
      Environment:
        Variables:
          DATABASE_URL: !Sub '{{resolve:secretsmanager:${PaymentDatabaseSecretName}:SecretString:DATABASE_URL}}'
          STRIPE_SECRET_KEY: !Sub '{{resolve:secretsmanager:${StripeSecretName}:SecretString:STRIPE_SECRET_KEY}}'
          STRIPE_WEBHOOK_SECRET: !Sub '{{resolve:secretsmanager:${StripeSecretName}:SecretString:STRIPE_WEBHOOK_SECRET}}'
          EVENTS_TOPIC_ARN: !Ref EventsTopic
          CORS_ORIGIN: '*'
      Policies:
        - SNSPublishMessagePolicy: { TopicName: !GetAtt EventsTopic.TopicName }

  PaymentEventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub pps-payment-events-${Environment}
      CodeUri: ../../deploy/artifacts/payment/
      Handler: dist/lambda.events
      Environment:
        Variables:
          DATABASE_URL: !Sub '{{resolve:secretsmanager:${PaymentDatabaseSecretName}:SecretString:DATABASE_URL}}'
          STRIPE_SECRET_KEY: !Sub '{{resolve:secretsmanager:${StripeSecretName}:SecretString:STRIPE_SECRET_KEY}}'
          STRIPE_WEBHOOK_SECRET: !Sub '{{resolve:secretsmanager:${StripeSecretName}:SecretString:STRIPE_WEBHOOK_SECRET}}'
          EVENTS_TOPIC_ARN: !Ref EventsTopic
      Policies:
        - SNSPublishMessagePolicy: { TopicName: !GetAtt EventsTopic.TopicName }
      Events:
        CheckoutEvents:
          Type: SQS
          Properties:
            Queue: !GetAtt PaymentEventsQueue.Arn
            BatchSize: 10
            FunctionResponseTypes: [ReportBatchItemFailures]

  PaymentOutboxFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub pps-payment-outbox-${Environment}
      CodeUri: ../../deploy/artifacts/payment/
      Handler: dist/lambda.publishOutbox
      Environment:
        Variables:
          DATABASE_URL: !Sub '{{resolve:secretsmanager:${PaymentDatabaseSecretName}:SecretString:DATABASE_URL}}'
          STRIPE_SECRET_KEY: !Sub '{{resolve:secretsmanager:${StripeSecretName}:SecretString:STRIPE_SECRET_KEY}}'
          STRIPE_WEBHOOK_SECRET: !Sub '{{resolve:secretsmanager:${StripeSecretName}:SecretString:STRIPE_WEBHOOK_SECRET}}'
          EVENTS_TOPIC_ARN: !Ref EventsTopic
      Policies:
        - SNSPublishMessagePolicy: { TopicName: !GetAtt EventsTopic.TopicName }
      Events:
        Schedule:
          Type: ScheduleV2
          Properties: { ScheduleExpression: rate(1 minute) }

  ApiServerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: PPS HTTP API is returning server errors
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions: [{ Name: ApiId, Value: !Ref PpsHttpApi }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  OrderDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties: { Namespace: AWS/SQS, MetricName: ApproximateNumberOfMessagesVisible, Dimensions: [{ Name: QueueName, Value: !GetAtt OrderEventsDlq.QueueName }], Statistic: Maximum, Period: 300, EvaluationPeriods: 1, Threshold: 1, ComparisonOperator: GreaterThanOrEqualToThreshold, TreatMissingData: notBreaching }
  PaymentDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties: { Namespace: AWS/SQS, MetricName: ApproximateNumberOfMessagesVisible, Dimensions: [{ Name: QueueName, Value: !GetAtt PaymentEventsDlq.QueueName }], Statistic: Maximum, Period: 300, EvaluationPeriods: 1, Threshold: 1, ComparisonOperator: GreaterThanOrEqualToThreshold, TreatMissingData: notBreaching }
  InventoryDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties: { Namespace: AWS/SQS, MetricName: ApproximateNumberOfMessagesVisible, Dimensions: [{ Name: QueueName, Value: !GetAtt InventoryEventsDlq.QueueName }], Statistic: Maximum, Period: 300, EvaluationPeriods: 1, Threshold: 1, ComparisonOperator: GreaterThanOrEqualToThreshold, TreatMissingData: notBreaching }
  NotificationDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties: { Namespace: AWS/SQS, MetricName: ApproximateNumberOfMessagesVisible, Dimensions: [{ Name: QueueName, Value: !GetAtt NotificationEventsDlq.QueueName }], Statistic: Maximum, Period: 300, EvaluationPeriods: 1, Threshold: 1, ComparisonOperator: GreaterThanOrEqualToThreshold, TreatMissingData: notBreaching }
  OrderOutboxErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties: { Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{ Name: FunctionName, Value: !Ref OrderOutboxFunction }], Statistic: Sum, Period: 300, EvaluationPeriods: 1, Threshold: 1, ComparisonOperator: GreaterThanOrEqualToThreshold, TreatMissingData: notBreaching }
  PaymentOutboxErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties: { Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{ Name: FunctionName, Value: !Ref PaymentOutboxFunction }], Statistic: Sum, Period: 300, EvaluationPeriods: 1, Threshold: 1, ComparisonOperator: GreaterThanOrEqualToThreshold, TreatMissingData: notBreaching }

Outputs:
  ApiUrl: { Value: !Sub 'https://${PpsHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}' }
  CartFunctionArn: { Value: !GetAtt CartFunction.Arn }
  OrderFunctionArn: { Value: !GetAtt OrderFunction.Arn }
  PaymentFunctionArn: { Value: !GetAtt PaymentFunction.Arn }
  EventsTopicArn: { Value: !Ref EventsTopic }
  PaymentEventsQueueArn: { Value: !GetAtt PaymentEventsQueue.Arn }
  OrderEventsQueueArn: { Value: !GetAtt OrderEventsQueue.Arn }
  InventoryEventsQueueArn: { Value: !GetAtt InventoryEventsQueue.Arn }
  NotificationEventsQueueArn: { Value: !GetAtt NotificationEventsQueue.Arn }
