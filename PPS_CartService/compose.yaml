name: pps-cart

services:
  memcached:
    image: memcached:1.6-alpine
    command: ["memcached", "-m", "64", "-I", "2m"]
    ports:
      - "127.0.0.1:11211:11211"
    healthcheck:
      test: ["CMD-SHELL", "echo stats | nc 127.0.0.1 11211 >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
